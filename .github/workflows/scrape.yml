name: Run Job Scraper Daily

on:
  schedule:
  - cron: '30 22 * * *' # 06:30 PHT every day (22:30 UTC)
  workflow_dispatch: # Allows you to click a button to run it manually anytime!

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        env:
          WEBHOOK_URL: ${{ secrets.SCRAPE_HOOK }}
          CATEGORIES: ${{ vars.CATEGORIES || 'automation;n8n;make.com;zapier|python|customer support;email support;chat support|virtual assistant' }}
          MAX_PER_CATEGORY: ${{ vars.MAX_PER_CATEGORY || '1' }}
        run: |
          python main.py
